server:
  port: 8080

spring:
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
  datasource:
    url: jdbc:mysql://localhost:3306/jaymetest?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-prefix: ""

knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    swagger-model-name: 实体类

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: random-64
  is-log: false
  jwt-secret-key: jaymetest2024secretkeyformusic

# 应用配置
app:
  jwt-secret: jaymetest2024secretkeyformusic

# 深渊模式难度阶梯配置
game:
  abyss:
    difficulty:
      early-tier: EASY           # streak 0-2: 100% EASY
      mid-tier-medium-prob: 0.7  # streak 3-5: 70% MEDIUM, 30% EASY
      mid-hard-tier-hard-prob: 0.6 # streak 6-9: 60% HARD, 40% MEDIUM
      hard-tier-hard-prob: 0.7   # streak 10-14: 70% HARD, 30% MEDIUM
      hard-tier: HARD            # streak 15-19: 100% HARD
      late-tier-hard-prob: 0.8   # streak 20-29: 80% HARD, 20% 不限
      endless-tier: HARD         # streak 30+: 50% HARD, 50% 不限
