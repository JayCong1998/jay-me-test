server:
  port: 8080

spring:
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
  datasource:
    url: jdbc:mysql://localhost:3306/jaymetest?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-prefix: ""

knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    swagger-model-name: 实体类

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: random-64
  is-log: false
  jwt-secret-key: jaymetest2024secretkeyformusic

# 应用配置
app:
  jwt-secret: jaymetest2024secretkeyformusic

# 深渊模式难度阶梯配置
game:
  classic:
    question-count: 10
    revival-count: 1
    easy-weight: 0.6
  album:
    question-count: 10
    pass-threshold: 8
    revival-count: 0
  abyss:
    batch-size: 5
    difficulty:
      # from/to 按当前连续答对数匹配；最后一档不写 to，表示覆盖 30+。
      # weights 是随机抽题权重，ANY 表示不限难度，用于后期增加变化和题库兜底。
      tiers:
        - from: 0
          to: 2
          weights: { EASY: 1.0 }
        - from: 3
          to: 5
          weights: { EASY: 0.3, MEDIUM: 0.7 }
        - from: 6
          to: 9
          weights: { MEDIUM: 0.4, HARD: 0.6 }
        - from: 10
          to: 14
          weights: { MEDIUM: 0.3, HARD: 0.7 }
        - from: 15
          to: 19
          weights: { HARD: 1.0 }
        - from: 20
          to: 29
          weights: { HARD: 0.8, ANY: 0.2 }
        - from: 30
          weights: { HARD: 0.5, ANY: 0.5 }
